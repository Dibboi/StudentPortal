<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UiTM Student Portal - Login and Register">
  <meta name="author" content="Adib">
  <title>UiTM Student Portal | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">

        <div class="text-center mb-4">
          <div class="uitm-logo mx-auto mb-2">UiTM</div>
          <h4 class="text-white fw-bold">Student Portal</h4>
          <p class="text-white-50 small">Universiti Teknologi MARA</p>
        </div>

        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">

            <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
              <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="pill"
                        data-bs-target="#loginPane" type="button" role="tab">Login</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="pill"
                        data-bs-target="#registerPane" type="button" role="tab">Register</button>
              </li>
            </ul>

            <div class="tab-content">

              <div class="tab-pane fade show active" id="loginPane">
                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="loginUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="loginUsername"
                           placeholder="username" required>
                  </div>
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword"
                           placeholder="password" required>
                  </div>
                  <div id="loginError" class="alert alert-danger py-2 small d-none"></div>
                  <button type="submit" class="btn btn-uitm w-100">Sign In</button>
                  <p class="text-center text-muted small mt-3 mb-0">
                    Demo: <code>username</code> / <code>password</code>
                  </p>
                </form>
              </div>

              <div class="tab-pane fade" id="registerPane">
                <form id="registerForm" novalidate>
                  <div class="mb-3">
                    <label for="regUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="regUsername"
                           placeholder="username" required>
                  </div>
                  <div class="mb-3">
                    <label for="regPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="regPassword"
                           placeholder="password" minlength="6" required>
                  </div>
                  <div id="regError" class="alert alert-danger py-2 small d-none"></div>
                  <div id="regSuccess" class="alert alert-success py-2 small d-none"></div>
                  <button type="submit" class="btn btn-uitm w-100">Create Account</button>
                </form>
              </div>

            </div>
          </div>
        </div>

        <p class="text-center text-white-50 small mt-3">
          © 2026 UiTM Student Portal · Developed by Adib
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
